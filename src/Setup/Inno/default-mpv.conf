# mpv.net 默认配置（由安装器写入，仅当目标机器没有 mpv.conf 时）
# 可随时通过菜单：配置 -> 编辑 mpv.conf 修改

# 关闭内置 OSC，改用 ModernZ 控制栏
osc=no

# 播完停在最后一帧（ModernZ 播放键自动变重播图标，点击从头重播）
keep-open=always

# ============================================================
# 索尼素材优化配置
# ============================================================

# 强制 ffmpeg(libavformat) 以 mp4 分离器打开，增强 mp4 容错
demuxer-lavf-format=mp4

# 给 mp4 分离器传 fflags：+genpts 重生成 PTS、+igndts 忽略错误 DTS
demuxer-lavf-o=fflags=+genpts+igndts

# 色彩空间：输出 full range；适配索尼 S-Log 到 BT.709
video-output-levels=full
target-prim=bt.709

# 关闭自定义着色器列表（减少开销）
glsl-shaders=
